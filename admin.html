<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Queen — لوحة المدير</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--card:#fff;--tx:#1f2a26;--mut:#6c7771;--ac:#1d6b52;--ac2:#e6f2ec;--bad:#b3402f;--wn:#b7791f;--bd:#e0dbcf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131c19;--card:#1c2824;--tx:#eef2ee;--mut:#9fb0a7;--ac:#4cb58c;--ac2:#243a32;--bad:#e27a68;--wn:#e0b25a;--bd:#31413a}}
:root[data-theme="dark"]{--bg:#131c19;--card:#1c2824;--tx:#eef2ee;--mut:#9fb0a7;--ac:#4cb58c;--ac2:#243a32;--bad:#e27a68;--wn:#e0b25a;--bd:#31413a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;max-width:820px;margin-inline:auto;padding:14px;font-size:16px}
h2{font-size:21px;margin:0}.sub{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
#brand{background:linear-gradient(135deg,#1d6b52,#0f3d2e);color:#fff;border-radius:16px;padding:14px 12px;text-align:center;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);border:1px solid rgba(201,162,74,.45)}#brand .nm{font-family:Georgia,"Times New Roman",serif;font-size:34px;font-weight:700;letter-spacing:2px;color:#f6d77a}#brand .sb{font-size:12px;opacity:.85;margin-top:2px}
.b:disabled{opacity:.3;cursor:not-allowed}.clock{font-size:40px;font-weight:700;text-align:center;letter-spacing:1px}.date{text-align:center;color:var(--mut);margin-bottom:12px}
button{font-family:inherit}
.b{padding:12px 18px;border:0;border-radius:12px;font-size:16px;color:#fff;background:var(--ac);cursor:pointer}.b.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.b.d{color:var(--bad)}.b.s{padding:6px 11px;font-size:14px}
.kp{text-align:center}.disp{font-size:34px;letter-spacing:6px;min-height:54px;margin:12px 0;padding:6px;border-radius:12px;background:var(--ac2)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.k{height:62px;font-size:24px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:14px;cursor:pointer}.k.go{background:var(--ac);color:#fff;font-size:18px}.k.cl{font-size:16px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;text-align:right;cursor:pointer;color:var(--tx);font-size:16px}.tile .ic{font-size:30px}.tile b{display:block;margin:6px 0 2px;font-size:18px}
.guide{background:var(--ac2);border-color:var(--ac)}.guide ol{margin:8px 0 0;padding-inline-start:22px;line-height:1.9}
input,select,textarea{padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;max-width:100%;font-family:inherit;width:100%;margin-bottom:8px}
input[type=checkbox]{width:auto}label{display:block;font-size:14px;color:var(--mut);margin:6px 0 3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.row>*{flex:1;min-width:130px;margin-bottom:0}.row>.b{flex:0 0 auto}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th{color:var(--mut);font-weight:400}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--ac);color:#fff;margin-inline-end:3px}.tag.o{background:var(--mut)}.tag.l{background:var(--bad)}.tag.t{background:var(--wn)}
.sts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.st{background:var(--ac2);border-radius:12px;padding:12px;text-align:center}.st b{display:block;font-size:22px}
.empty{color:var(--mut);text-align:center;padding:16px}.big{font-size:56px;text-align:center}
img.ph{width:34px;height:34px;border-radius:8px;object-fit:cover;vertical-align:middle}
.item{width:100%;display:flex;justify-content:space-between;padding:13px;margin-bottom:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;font-size:16px;cursor:pointer}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.md{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:360px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:12px;display:none;z-index:10}
#prt{display:none}
@media print{body *{visibility:hidden}#res,#res *,#prt,#prt *{visibility:visible}#res,#prt{position:absolute;top:0;inset-inline:0}#prt{display:block}body.pw #v{display:none!important}}
</style>
</head>
<body>
<div id="brand"></div><div id="v"></div><div id="toast"></div><div id="prt"></div>
<script>
var MODE="admin";
var K="att_v2",DEF=[],OLDD=["الكوتينج","السايزنج","النسيج + السداية","الإدارة","الخدمات","المصبغة"];
var S={workers:[],log:[],cfg:{mpin:null,start:"08:00",end:"16:00",grace:10,off:5,selfie:false,usePin:true,depts:DEF,radius:150,useLoc:false,loc:null,shopName:"Queen"},lock:{},hol:[],leaves:[],adv:[]},unl=0,V=document.getElementById("v");
var SRC=K;
try{var raw=localStorage.getItem(K),cur=raw?JSON.parse(raw):null;
 if(!cur||(!(cur.workers||[]).length&&!(cur.log||[]).length)){
  for(var qi=0;qi<localStorage.length;qi++){var kk=localStorage.key(qi);if(kk===K)continue;
   try{var oo=JSON.parse(localStorage.getItem(kk));if(oo&&Array.isArray(oo.workers)&&Array.isArray(oo.log)&&(oo.workers.length||oo.log.length)){cur=oo;SRC=kk;break}}catch(e2){}}}
 if(cur)S=cur}catch(e){}
function norm(){S.cfg=Object.assign({start:"08:00",end:"16:00",grace:10,off:5,selfie:false,usePin:true,depts:DEF,radius:150,useLoc:false,loc:null,shopName:"Queen"},S.cfg||{});S.lock=S.lock||{};S.hol=S.hol||[];S.leaves=S.leaves||[];S.adv=S.adv||[];S.cfg.depts=[]}
norm();
function nextCode(){var m=1000;S.workers.forEach(function(w){var n=parseInt(w.code,10);if(n>m)m=n});return String(m+1)}
S.workers.forEach(function(w){if(!w.code)w.code=nextCode()});
function prune(days){var lim=Date.now()-days*864e5;S.log.forEach(function(r){if(r.in<lim){delete r.p;delete r.po}})}
function save(){var w=function(){localStorage.setItem(K,JSON.stringify(S))};try{w()}catch(e){prune(3);try{w()}catch(e2){prune(0);try{w()}catch(e3){alert("مساحة التخزين امتلت. نزّل نسخة احتياطية من الإعدادات.")}}}}
function pd(n){return String(n).padStart(2,"0")}
function dk(d){return d.getFullYear()+"-"+pd(d.getMonth()+1)+"-"+pd(d.getDate())}
function dn(s){return new Date(s+"T00:00:00").toLocaleDateString("ar-EG",{weekday:"long"})}
function tm(t){var d=new Date(t),h=d.getHours();return pd(h%12||12)+":"+pd(d.getMinutes())+" "+(h<12?"ص":"م")}
function tm24(t){var d=new Date(t);return pd(d.getHours())+":"+pd(d.getMinutes())}
function hm12(x){var p=x.split(":"),h=+p[0];return pd(h%12||12)+":"+p[1]+" "+(h<12?"ص":"م")}
function clk(n){var h=n.getHours();return pd(h%12||12)+":"+pd(n.getMinutes())+":"+pd(n.getSeconds())+" "+(h<12?"ص":"م")}
function hrs(a,b){return b?(b-a)/36e5:0}
function fmt(h){var m=Math.round(h*60);return Math.floor(m/60)+"س "+pd(m%60)+"د"}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function at(day,hm){var p=hm.split(":"),d=new Date(day+"T00:00:00");d.setHours(+p[0],+p[1],0,0);return d.getTime()}
function open_(id){return S.log.find(function(r){return r.w===id&&!r.out&&Date.now()-r.in<576e5})}
function stale(r){return!r.out&&Date.now()-r.in>=576e5}
function earlyMin(r){if(!r.out)return 0;var m=(at(r.d,S.cfg.end)-r.out)/6e4;return m>S.cfg.grace?Math.round(m):0}
function yn(msg){return new Promise(function(res){var m=modal('<div style="font-size:18px;line-height:1.8">'+msg+'</div><div class="row" style="margin-top:12px"><button class="b" id="y">أيوه، متأكد</button><button class="b g" id="n">لأ</button></div>');m.querySelector("#y").onclick=function(){m.remove();res(true)};m.querySelector("#n").onclick=function(){m.remove();res(false)}})}
function wk(id){return S.workers.find(function(x){return x.id===id})}
function wname(id){var w=wk(id);return w?w.name:"(محذوف)"}
function holOn(d){return S.hol.find(function(h){return d>=h.from&&d<=h.to})}
function leaveOn(w,d){return S.leaves.find(function(l){return l.w===w&&d>=l.from&&d<=l.to})}
function dist(a,b){var R=6371000,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lng-a.lng)*t,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x))}
function locOn(){return S.cfg.useLoc&&S.cfg.loc}
function getPos(){return new Promise(function(res){if(!locOn())return res(null);if(!navigator.geolocation)return res("x");navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude})},function(){res("x")},{enableHighAccuracy:true,timeout:7000,maximumAge:0})})}
function gDist(gp){if(!locOn())return null;if(!gp||gp==="x")return -1;return Math.round(dist(gp,S.cfg.loc))}
function locTag(r){var h="";[r.g,r.go].forEach(function(g,i){if(g==null)return;if(g===-1)h+='<span class="tag o">الموقع غير متاح</span>';else if(g>S.cfg.radius)h+='<span class="tag l">خارج المحل '+g+' م'+(i?' (انصراف)':'')+'</span>'});return h}
function flagsOf(r){var f="",l=lateMin(r),o=otH(r);if(l)f+='<span class="tag l">متأخر '+l+' د</span>';if(o>=.25)f+='<span class="tag">إضافي '+fmt(o)+'</span>';var e=earlyMin(r);if(e)f+='<span class="tag l">انصراف مبكر '+fmt(e/60)+'</span>';if(stale(r))f+='<span class="tag l">بدون انصراف</span>';if(r.m)f+='<span class="tag t" title="'+esc(r.why)+'">معدّل</span>';if(r.p==="x")f+='<span class="tag o">بدون صورة</span>';return f+locTag(r)}
function lateMin(r){var m=(r.in-at(r.d,S.cfg.start))/6e4;return m>S.cfg.grace?Math.round(m):0}
function otH(r){return r.out?Math.max(0,(r.out-at(r.d,S.cfg.end))/36e5):0}
function rnd(){return String(Math.floor(1000+Math.random()*9000))}
async function H(s){try{var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("att|"+s));return Array.from(new Uint8Array(b)).map(function(x){return pd(x.toString(16))}).join("")}catch(e){var h=0,t="att|"+s;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return"f"+h}}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(function(){e.style.display="none"},2600)}
function modal(h){var m=document.createElement("div");m.className="mo";m.innerHTML='<div class="md">'+h+'</div>';document.body.appendChild(m);return m}
function info(t){modal('<div style="font-size:18px;line-height:1.8">'+t+'</div><button class="b" style="width:100%;margin-top:12px" id="okk">تمام</button>').querySelector("#okk").onclick=function(){this.closest(".mo").remove()}}
async function dl(name,data){
 try{if(typeof claude!=="undefined"){var d=await claude.use("downloads");if(d){await d.save({filename:name,data:data});return}}}catch(e){}
 try{var ty=/\.html$/.test(name)?"text/html":/\.json$/.test(name)?"application/json":"text/csv";var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:ty+";charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){info("التنزيل غير متاح هنا")}}
async function snap(){if(!S.cfg.selfie)return null;try{var st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}}),v=document.createElement("video");v.srcObject=st;v.muted=true;v.playsInline=true;await v.play();await new Promise(function(r){setTimeout(r,900)});var c=document.createElement("canvas");c.width=c.height=100;var s=Math.min(v.videoWidth,v.videoHeight);c.getContext("2d").drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,100,100);st.getTracks().forEach(function(t){t.stop()});return c.toDataURL("image/jpeg",.4)}catch(e){return"x"}}

/* ---------- لوحة الأرقام ---------- */
function keypad(o){var val="";
 V.innerHTML='<div class="card kp"><h2>'+o.title+'</h2><div class="sub">'+(o.sub||"")+'</div><div class="disp" id="dp">&nbsp;</div><div class="keys">'+[1,2,3,4,5,6,7,8,9,"مسح",0,"تأكيد"].map(function(k){return'<button class="k'+(k==="تأكيد"?" go":k==="مسح"?" cl":"")+'" data-k="'+k+'">'+k+'</button>'}).join("")+'</div>'+(o.extra||"")+(o.back?'<button class="b g" id="kb" style="width:100%">رجوع</button>':"")+'</div>';
 var dp=document.getElementById("dp");
 if(window._kh)document.removeEventListener("keydown",window._kh);
 window._kh=function(e){if(!V.querySelector(".keys")||document.querySelector(".mo"))return;var t=(e.target.tagName||"").toLowerCase();if(t==="input"||t==="textarea"||t==="select")return;var k=null;if(/^[0-9]$/.test(e.key))k=e.key;else if(e.key==="Enter")k="تأكيد";else if(e.key==="Backspace")k="مسح";if(k===null)return;var b=V.querySelector('[data-k="'+k+'"]');if(b){e.preventDefault();b.click()}};
 document.addEventListener("keydown",window._kh);
 V.querySelector(".keys").onclick=function(e){var k=e.target.dataset.k;if(k==null)return;
  if(k==="مسح")val=val.slice(0,-1);else if(k==="تأكيد"){if(val)o.ok(val);return}else if(val.length<(o.max||8))val+=k;
  dp.textContent=o.mask?val.replace(/./g,"●"):val;if(!val)dp.innerHTML="&nbsp;"};
 if(o.back)document.getElementById("kb").onclick=o.back}

/* ---------- شاشة التسجيل (للعمال) ---------- */
function clockHtml(){var n=new Date();return'<div class="clock" id="clk">'+clk(n)+'</div><div class="date">'+n.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"})+'</div>'+(holOn(dk(n))?'<div class="sub" style="text-align:center;margin:-6px 0 10px">اليوم عطلة: '+esc(holOn(dk(n)).name)+'</div>':"")}
function brand(sub){document.getElementById("brand").innerHTML='<div class="nm">👑 '+esc(S.cfg.shopName||"Queen")+'</div><div class="sb">'+sub+'</div>'}
function lockScreen(){brand("لوحة المدير");V.innerHTML='<div class="card kp"><div class="big">🔒</div><h2>لوحة المدير</h2><button class="b" id="en" style="width:100%;margin-top:14px">دخول</button></div>';document.getElementById("en").onclick=adminEnter}
function home(){if(MODE==="admin")return lockScreen();brand("تسجيل الحضور والانصراف");unlocked()||0;
 keypad({title:"اكتب كودك",sub:"الكود اللي اتسلّمتهولك الإدارة",max:6,ok:function(c){var w=S.workers.find(function(x){return x.code===c});if(!w){toast(S.workers.length?"الكود ده مش موجود":"مفيش عمال متسجّلين على الصفحة دي لسه. الإدارة لازم تضيفهم أو تسترجع النسخة الاحتياطية");return home()}choose(w)},
  extra:'<button class="b g" id="sr" style="width:100%;margin-bottom:8px">مش فاكر الكود؟ ابحث بالاسم</button>'});
 V.insertAdjacentHTML("afterbegin",clockHtml());
 document.getElementById("sr").onclick=search}
function search(){V.innerHTML='<div class="top"><h2>ابحث بالاسم</h2><button class="b g s" id="bk">← رجوع</button></div><div class="card"><input id="q" placeholder="اكتب جزء من الاسم" autofocus><div id="rs"></div></div>';
 var q=document.getElementById("q"),rs=document.getElementById("rs");
 q.oninput=function(){var t=q.value.trim();if(t.length<2){rs.innerHTML="";return}var l=S.workers.filter(function(w){return w.name.indexOf(t)>-1}).slice(0,25);
  rs.innerHTML=l.map(function(w){return'<button class="item" data-id="'+w.id+'"><span>'+esc(w.name)+'</span><span class="sub">'+esc(w.dept)+'</span></button>'}).join("")||'<div class="empty">مفيش نتائج</div>'};
 rs.onclick=function(e){var b=e.target.closest("[data-id]");if(b)choose(wk(b.dataset.id))};
 document.getElementById("bk").onclick=home}
function choose(w){var o=open_(w.id),st=S.log.slice().reverse().find(function(r){return r.w===w.id&&stale(r)});
 V.innerHTML='<div class="card kp"><h2>أهلاً '+esc(w.name)+'</h2><div class="sub" style="margin:8px 0 16px;line-height:1.8">'+(o?'حاضر من '+tm(o.in):'مفيش حضور مسجل دلوقتي')+(st?'<br><span style="color:var(--bad)">في يوم ('+st.d+') ما اتسجلش له انصراف</span>':'')+'</div><div class="row"><button class="b" id="ci" style="flex:1;padding:24px;font-size:22px"'+(o?" disabled":"")+'>🟢 حضور</button><button class="b out" id="co" style="flex:1;padding:24px;font-size:22px"'+(o?"":" disabled")+'>🔴 انصراف</button></div><button class="b g" id="cb" style="width:100%;margin-top:8px">رجوع</button></div>';
 document.getElementById("cb").onclick=home;
 document.getElementById("ci").onclick=function(){askPin(w,"in")};
 document.getElementById("co").onclick=async function(){var endT=at(dk(new Date()),S.cfg.end);if(Date.now()<endT-S.cfg.grace*6e4&&!(await yn("الوقت دلوقتي قبل نهاية الشغل ("+hm12(S.cfg.end)+"). ده هيتسجّل <b>انصراف مبكر</b>. تكمل؟")))return;askPin(w,"out")}}
function askPin(w,act){var L=S.lock[w.id]||{n:0,until:0};
 if(L.until>Date.now()){info("الحساب مقفول مؤقتاً بسبب محاولات غلط. جرّب بعد "+Math.ceil((L.until-Date.now())/6e4)+" دقيقة.");return home()}
 var o=open_(w.id);
 if(!S.cfg.usePin){V.innerHTML='<div class="card kp"><h2>أهلاً '+esc(w.name)+'</h2><div class="sub" style="margin:8px 0 16px">'+(act==="out"?"هتسجّل <b>انصراف</b>":"هتسجّل <b>حضور</b>")+'</div><button class="b" id="cf" style="width:100%;margin-bottom:8px;font-size:20px;padding:16px">تأكيد</button><button class="b g" id="cn" style="width:100%">رجوع</button></div>';document.getElementById("cn").onclick=home;document.getElementById("cf").onclick=function(){doPunch(w,act)};return}
 keypad({title:"أهلاً "+esc(w.name),sub:(act==="out"?"هتسجّل <b>انصراف</b>":"هتسجّل <b>حضور</b>")+" — اكتب رقمك السري",mask:1,max:8,back:home,ok:async function(p){
  if(await H(p)!==w.pin){L.n++;if(L.n>=3){L.until=Date.now()+3e5;L.n=0}S.lock[w.id]=L;save();toast("الرقم السري غلط");return askPin(w,act)}
  S.lock[w.id]={n:0,until:0};doPunch(w,act)}})}
async function doPunch(w,act){var n=Date.now(),op=open_(w.id);if(act==="out"&&!op){toast("مفيش حضور مسجل");return home()}if(act==="in"&&op){toast("إنت مسجّل حضور بالفعل");return home()}
  if(locOn())V.innerHTML='<div class="card kp"><div class="big">📍</div><h2>جاري التأكد من الموقع…</h2></div>';var ph=await snap(),gp=await getPos(),g=gDist(gp);
  if(op){op.out=n;op.po=ph;op.go=g}else S.log.push({w:w.id,d:dk(new Date(n)),in:n,out:null,p:ph,g:g});
  save();V.innerHTML='<div class="card"><div class="big">✅</div><h2 style="text-align:center">تم تسجيل '+(op?"انصرافك":"حضورك")+'</h2><div class="clock">'+tm(n)+'</div><div class="date">'+esc(w.name)+'</div></div>';setTimeout(home,3000)}

</script>
</body>
</html>
