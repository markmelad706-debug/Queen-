<style>

var K="att_v2",DEF=[],OLDD=["الكوتينج","السايزنج","النسيج + السداية","الإدارة","الخدمات","المصبغة"];

var DB=null,CE=false,curPage=null;try{var rawL=localStorage.getItem(K+"_lock");if(rawL)S.lock=JSON.parse(rawL)}catch(e){}

norm();
function nextCode(){var m=1000;S.workers.forEach(function(w){var n=parseInt(w.code,10);if(n>m)m=n});return String(m+1)}
S.workers.forEach(function(w){if(!w.code)w.code=nextCode()});
function prune(days){var lim=Date.now()-days*864e5;S.log.forEach(function(r){if(r.in<lim){delete r.p;delete r.po}})}

 if(!CE||!DB)return;
 DB.doc("app/state").set({json:JSON.stringify({workers:S.workers,cfg:S.cfg,hol:S.hol,leaves:S.leaves,adv:S.adv})}).catch(function(){toast("تعذر الحفظ، اتأكد من النت")})}
function nid(){return"r"+Date.now()+Math.random().toString(36).slice(2,6)}

function pd(n){return String(n).padStart(2,"0")}
function dk(d){return d.getFullYear()+"-"+pd(d.getMonth()+1)+"-"+pd(d.getDate())}
function tm(t){var d=new Date(t),h=d.getHours();return pd(h%12||12)+":"+pd(d.getMinutes())+" "+(h<12?"ص":"م")}
function tm24(t){var d=new Date(t);return pd(d.getHours())+":"+pd(d.getMinutes())}

function hrs(a,b){return b?(b-a)/36e5:0}
function fmt(h){var m=Math.round(h*60);return Math.floor(m/60)+"س "+pd(m%60)+"د"}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function at(day,hm){var p=hm.split(":"),d=new Date(day+"T00:00:00");d.setHours(+p[0],+p[1],0,0);return d.getTime()}
function open_(id){return S.log.find(function(r){return r.w===id&&!r.out&&Date.now()-r.in<576e5})}
function stale(r){return!r.out&&Date.now()-r.in>=576e5}
function wk0(id){return S.workers.filter(function(w){return w.id===id})[0]||{}}
function shS(id){return wk0(id).s||S.cfg.start}
function shE(id){return wk0(id).e||S.cfg.end}
function isFri(d){return new Date(d+"T12:00:00").getDay()===5}
function offOf(w){var o=w.off;return(o===undefined||o==="")?+S.cfg.off:+o}
function endAt(d,id){return at(d,shE(id))}
function earlyMin(r){if(!r.out||isFri(r.d)||wk0(r.w).flex)return 0;var m=(endAt(r.d,r.w)-r.out)/6e4;return m>S.cfg.grace?Math.round(m):0}
function yn(msg){return new Promise(function(res){var m=modal('<div style="font-size:18px;line-height:1.8">'+msg+'</div><div class="row" style="margin-top:12px"><button class="b" id="y">أيوه، متأكد</button><button class="b g" id="n">لأ</button></div>');m.querySelector("#y").onclick=function(){m.remove();res(true)};m.querySelector("#n").onclick=function(){m.remove();res(false)}})}
function wk(id){return S.workers.find(function(x){return x.id===id})}
function wname(id){var w=wk(id);return w?w.name:"(محذوف)"}
function holOn(d){return S.hol.find(function(h){return d>=h.from&&d<=h.to})}
function leaveOn(w,d){return S.leaves.find(function(l){return l.w===w&&d>=l.from&&d<=l.to})}
function dist(a,b){var R=6371000,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lng-a.lng)*t,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x))}
function locOn(){return S.cfg.useLoc&&S.cfg.loc}
function getPos(){return new Promise(function(res){if(!locOn())return res(null);if(!navigator.geolocation)return res("x");navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude})},function(){res("x")},{enableHighAccuracy:true,timeout:7000,maximumAge:0})})}
function gDist(gp){if(!locOn())return null;if(!gp||gp==="x")return -1;return Math.round(dist(gp,S.cfg.loc))}
function locTag(r){var h="";[r.g,r.go].forEach(function(g,i){if(g==null)return;if(g===-1)h+='<span class="tag o">الموقع غير متاح</span>';else if(g>S.cfg.radius)h+='<span class="tag l">خارج المحل '+g+' م'+(i?' (انصراف)':'')+'</span>'});return h}
function flagsOf(r){var f="",l=lateMin(r),o=otH(r);if(l)f+='<span class="tag l">متأخر '+l+' د</span>';if(o>=.25)f+='<span class="tag">إضافي '+fmt(o)+'</span>';var e=earlyMin(r);if(e)f+='<span class="tag l">انصراف مبكر '+fmt(e/60)+'</span>';if(stale(r))f+='<span class="tag l">بدون انصراف</span>';if(r.m)f+='<span class="tag t" title="'+esc(r.why)+'">معدّل</span>';if(r.p==="x")f+='<span class="tag o">بدون صورة</span>';return f+locTag(r)}
function lateMin(r){if(isFri(r.d)||wk0(r.w).flex)return 0;var m=(r.in-at(r.d,shS(r.w)))/6e4;return m>S.cfg.grace?Math.round(m):0}
function otH(r){return r.out&&!isFri(r.d)&&!wk0(r.w).flex?Math.max(0,(r.out-endAt(r.d,r.w))/36e5):0}
function rnd(){return String(Math.floor(1000+Math.random()*9000))}
async function H(s){try{var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("att|"+s));return Array.from(new Uint8Array(b)).map(function(x){return pd(x.toString(16))}).join("")}catch(e){var h=0,t="att|"+s;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return"f"+h}}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(function(){e.style.display="none"},2600)}
function modal(h){var m=document.createElement("div");m.className="mo";m.innerHTML='<div class="md">'+h+'</div>';document.body.appendChild(m);return m}
function info(t){modal('<div style="font-size:18px;line-height:1.8">'+t+'</div><button class="b" style="width:100%;margin-top:12px" id="okk">تمام</button>').querySelector("#okk").onclick=function(){this.closest(".mo").remove()}}
async function dl(name,data){var b=new Blob([data],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(a.href)},500)}
async function snap(){if(!S.cfg.selfie)return null;try{var st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}}),v=document.createElement("video");v.srcObject=st;v.muted=true;v.playsInline=true;await v.play();await new Promise(function(r){setTimeout(r,900)});var c=document.createElement("canvas");c.width=c.height=100;var s=Math.min(v.videoWidth,v.videoHeight);c.getContext("2d").drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,100,100);st.getTracks().forEach(function(t){t.stop()});return c.toDataURL("image/jpeg",.4)}catch(e){return"x"}}

function keypad(o){var val="";
 V.innerHTML='<div class="card kp"><h2>'+o.title+'</h2><div class="sub">'+(o.sub||"")+'</div><div class="disp" id="dp">&nbsp;</div><div class="keys">'+[1,2,3,4,5,6,7,8,9,"مسح",0,"تأكيد"].map(function(k){return'<button class="k'+(k==="تأكيد"?" go":k==="مسح"?" cl":"")+'" data-k="'+k+'">'+k+'</button>'}).join("")+'</div>'+(o.extra||"")+(o.back?'<button class="b g" id="kb" style="width:100%">رجوع</button>':"")+'</div>';
 var dp=document.getElementById("dp");
 if(window._kh)document.removeEventListener("keydown",window._kh);
 window._kh=function(e){if(!V.querySelector(".keys")||document.querySelector(".mo"))return;var t=(e.target.tagName||"").toLowerCase();if(t==="input"||t==="textarea"||t==="select")return;var k=null;if(/^[0-9]$/.test(e.key))k=e.key;else if(e.key==="Enter")k="تأكيد";else if(e.key==="Backspace")k="مسح";if(k===null)return;var b=V.querySelector('[data-k="'+k+'"]');if(b){e.preventDefault();b.click()}};
 document.addEventListener("keydown",window._kh);
 V.querySelector(".keys").onclick=function(e){var k=e.target.dataset.k;if(k==null)return;
  if(k==="مسح")val=val.slice(0,-1);else if(k==="تأكيد"){if(val)o.ok(val);return}else if(val.length<(o.max||8))val+=k;
  dp.textContent=o.mask?val.replace(/./g,"●"):val;if(!val)dp.innerHTML="&nbsp;"};
 if(o.back)document.getElementById("kb").onclick=o.back}

function clockHtml(){var n=new Date();return'<div class="clock" id="clk">'+clk(n)+'</div><div class="date">'+n.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"})+'</div>'+(holOn(dk(n))?'<div class="sub" style="text-align:center;margin:-6px 0 10px">اليوم عطلة: '+esc(holOn(dk(n)).name)+'</div>':"")}
function homeW(){unlocked()||0;
 keypad({title:"اكتب كودك",sub:"الكود اللي اتسلّمتهولك الإدارة",max:6,ok:function(c){var w=S.workers.find(function(x){return x.code===c});if(!w){toast("الكود ده مش موجود");return home()}choose(w)},
  extra:'<button class="b g" id="sr" style="width:100%;margin-bottom:8px">مش فاكر الكود؟ ابحث بالاسم</button>'+(1?'<button class="b g s" id="mg" style="width:100%">لوحة المدير 🔒</button>':"")});
 V.insertAdjacentHTML("afterbegin",clockHtml());
 document.getElementById("sr").onclick=search;var mgb=document.getElementById("mg");if(mgb)mgb.onclick=adminEnter}
function search(){V.innerHTML='<div class="top"><h2>ابحث بالاسم</h2><button class="b g s" id="bk">← رجوع</button></div><div class="card"><input id="q" placeholder="اكتب جزء من الاسم" autofocus><div id="rs"></div></div>';
 var q=document.getElementById("q"),rs=document.getElementById("rs");
 q.oninput=function(){var t=q.value.trim();if(t.length<2){rs.innerHTML="";return}var l=S.workers.filter(function(w){return w.name.indexOf(t)>-1}).slice(0,25);
  rs.innerHTML=l.map(function(w){return'<button class="item" data-id="'+w.id+'"><span>'+esc(w.name)+'</span><span class="sub">'+esc(w.dept)+'</span></button>'}).join("")||'<div class="empty">مفيش نتائج</div>'};
 rs.onclick=function(e){var b=e.target.closest("[data-id]");if(b)choose(wk(b.dataset.id))};
 document.getElementById("bk").onclick=home}
function choose(w){var o=open_(w.id),st=S.log.slice().reverse().find(function(r){return r.w===w.id&&stale(r)});
 V.innerHTML='<div class="card kp"><h2>أهلاً '+esc(w.name)+'</h2><div class="sub" style="margin:8px 0 16px;line-height:1.8">'+(o?'حاضر من '+tm(o.in):'مفيش حضور مسجل دلوقتي')+(st?'<br><span style="color:var(--bad)">في يوم ('+st.d+') ما اتسجلش له انصراف</span>':'')+'</div><div class="row"><button class="b" id="ci" style="flex:1;padding:24px;font-size:22px"'+(o?" disabled":"")+'>🟢 حضور</button><button class="b out" id="co" style="flex:1;padding:24px;font-size:22px"'+(o?"":" disabled")+'>🔴 انصراف</button></div><button class="b g" id="cb" style="width:100%;margin-top:8px">رجوع</button></div>';
 document.getElementById("cb").onclick=home;
 document.getElementById("ci").onclick=function(){askPin(w,"in")};
 document.getElementById("co").onclick=async function(){var endT=endAt(dk(new Date()),w.id);if(new Date().getDay()!==5&&!w.flex&&Date.now()<endT-S.cfg.grace*6e4&&!(await yn("الوقت دلوقتي قبل نهاية الشغل ("+hm12(shE(w.id))+"). ده هيتسجّل <b>انصراف مبكر</b>. تكمل؟")))return;askPin(w,"out")}}
function askPin(w,act){var L=S.lock[w.id]||{n:0,until:0};
 if(L.until>Date.now()){info("الحساب مقفول مؤقتاً بسبب محاولات غلط. جرّب بعد "+Math.ceil((L.until-Date.now())/6e4)+" دقيقة.");return home()}
 var o=open_(w.id);
 if(!S.cfg.usePin){V.innerHTML='<div class="card kp"><h2>أهلاً '+esc(w.name)+'</h2><div class="sub" style="margin:8px 0 16px">'+(act==="out"?"هتسجّل <b>انصراف</b>":"هتسجّل <b>حضور</b>")+'</div><button class="b" id="cf" style="width:100%;margin-bottom:8px;font-size:20px;padding:16px">تأكيد</button><button class="b g" id="cn" style="width:100%">رجوع</button></div>';document.getElementById("cn").onclick=home;document.getElementById("cf").onclick=function(){doPunch(w,act)};return}
 keypad({title:"أهلاً "+esc(w.name),sub:(act==="out"?"هتسجّل <b>انصراف</b>":"هتسجّل <b>حضور</b>")+" — اكتب رقمك السري",mask:1,max:8,back:home,ok:async function(p){
  if(await H(p)!==w.pin){L.n++;if(L.n>=3){L.until=Date.now()+3e5;L.n=0}S.lock[w.id]=L;save();toast("الرقم السري غلط");return askPin(w,act)}
  S.lock[w.id]={n:0,until:0};doPunch(w,act)}})}
async function doPunch(w,act){var n=Date.now(),op=open_(w.id);if(act==="out"&&!op){toast("مفيش حضور مسجل");return home()}if(act==="in"&&op){toast("إنت مسجّل حضور بالفعل");return home()}
