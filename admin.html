  if(st.exists){const old=JSON.parse(st.data().json),ops=[];o={workers:(old.workers||[]).map(w=>{const x=Object.assign({},w);delete x.pin;return x}),cfg:old.cfg||{},hol:old.hol||[]};
   (old.adv||[]).forEach(a=>{const id=a.id||nid();ops.push(b=>b.set(DB.collection("adv").doc(id),Object.assign({},a,{id})))});(old.leaves||[]).forEach(l=>{const id=l.id||nid();ops.push(b=>b.set(DB.collection("leaves").doc(id),Object.assign({},l,{id})))});await bw(ops)}
  await DB.doc("app/public").set({json:JSON.stringify(o)})}catch(e){migrating=false;loadErr()}},loadErr)}
let listening=false;
function listen(){if(listening)return;listening=true;
 DB.collection("adv").onSnapshot(q=>{ADV.length=0;q.docs.forEach(d=>ADV.push(Object.assign({},d.data(),{id:d.id})));ref()});
 DB.collection("leaves").onSnapshot(q=>{LV.length=0;q.docs.forEach(d=>LV.push(Object.assign({},d.data(),{id:d.id})));ref()});
 DB.collection("requests").onSnapshot(q=>{REQ.length=0;q.docs.forEach(d=>{const x=d.data(),c=x.created||0;REQ.push(x.kind==="advance"?{id:d.id,w:x.workerId,k:"a",amt:+x.amount||0,note:x.note||"",c,t:"سلفة "+(+x.amount||0).toLocaleString("ar-EG")+" ج"+(x.note?" — "+x.note:"")}:{id:d.id,w:x.workerId,k:"l",f:x.from,e:x.to,c,t:"إجازة من "+x.from+" إلى "+x.to+(x.reason?" — "+x.reason:"")})});REQ.sort((a,b)=>b.c-a.c);ref()})}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-rq],[data-rd]");if(!b)return;const id=b.dataset.rq||b.dataset.rd,r=REQ.find(x=>x.id===id);if(!r)return;
 try{if(b.dataset.rq){if(r.k==="l"){addLeave({w:r.w,from:r.f,to:r.e,source:"worker-request"});M=r.f.slice(0,7)}else addAdv({w:r.w,d:r.c?dk(new Date(r.c)):TD,amt:r.amt,note:r.note||"طلب من العامل"});await DB.collection("requests").doc(id).delete();toast(r.k==="l"?"تم تسجيل الإجازة وهتظهر في التقرير":"تم تسجيل السلفة")}
  else{if(!(await yn("حذف الطلب؟")))return;await DB.collection("requests").doc(id).delete()}}catch(x){toast("تعذر تنفيذ العملية")}
 (CUR||aHome)()});
/* ---- الصور ---- */
function phOf(r){const a=r.p&&String(r.p).startsWith("data:")?r.p:null;if(a)return'<img class="ph" src="'+a+'" data-id="'+r._id+'">';if(r.p===1)return'<img class="ph" data-ph="'+r._id+'" data-id="'+r._id+'" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">';return""}
function loadPh(){document.querySelectorAll("img[data-ph]").forEach(i=>{const id=i.dataset.ph;i.removeAttribute("data-ph");DB.collection("photos").doc(id).get().then(s=>{if(s.exists&&s.data().i)i.src=s.data().i}).catch(()=>{})})}
async function showPh(id){const r=LOG.find(x=>x._id===id);if(!r)return;let i=r.p&&String(r.p).startsWith("data:")?r.p:null,o=r.po&&String(r.po).startsWith("data:")?r.po:null;
 if(r.p===1||r.po===1){try{const s=await DB.collection("photos").doc(id).get();if(s.exists){i=i||s.data().i;o=o||s.data().o}}catch(e){}}
 modal('<h2 style="margin-bottom:8px">'+esc(nmOf(r.w))+'</h2><div class="row">'+(i?'<div><label>حضور</label><img src="'+i+'" style="width:100%;border-radius:14px"></div>':"")+(o?'<div><label>انصراف</label><img src="'+o+'" style="width:100%;border-radius:14px"></div>':"")+'</div>'+(!i&&!o?'<div class="sub">مفيش صور</div>':""))}
document.addEventListener("click",e=>{const im=e.target.closest("img[data-id]");if(im)showPh(im.dataset.id)});
/* ---- الإعدادات ---- */
function aSet(){CUR=aSet;REF=null;dockShow(true,"more");const ck=(id,t,v)=>'<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="'+id+'"'+(v?" checked":"")+'> '+t+'</label>';
 $("app").innerHTML=hd("الإعدادات")+'<div class="card"><h2>المواعيد العامة</h2><div class="sub">لو العامل ملوش مواعيد خاصة (من صفحة العمال).</div><div class="row"><div><label>البداية</label><input type="time" id="s1" value="'+C.start+'"></div><div><label>النهاية</label><input type="time" id="s2" value="'+C.end+'"></div></div><label>سماح التأخير (دقائق)</label><input type="number" id="s3" min="0" value="'+C.grace+'"><label>الإجازة الأسبوعية</label><select id="s4"><option value="-1"'+(OFFD<0?" selected":"")+'>مفيش إجازة أسبوعية</option>'+["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"].map((d,i)=>'<option value="'+i+'"'+(i===OFFD?" selected":"")+'>'+d+'</option>').join("")+'</select>'+ck("s5","صورة سيلفي عند كل تسجيل",C.selfie)+'</div><div class="card"><h2>📍 موقع المحل</h2><div class="sub" id="ls">'+(C.loc?"تم تحديد موقع المحل":"لسه ما اتحددش")+'</div><button class="b g" id="gl" style="width:100%;margin:8px 0">تحديد موقع المحل (وإنت واقف فيه بالتابلت)</button>'+ck("s7","سجّل الموقع مع كل حضور وانصراف",C.useLoc)+'<label>أقصى مسافة مسموحة (متر)</label><input type="number" id="s8" min="20" value="'+C.radius+'"><div class="sub">لو التسجيل حصل بعيد عن الحد ده بيتعلّم «خارج المحل». التسجيل بيتم برضه، والتعليم للمراجعة بس.</div></div><button class="b" id="sv" style="width:100%">حفظ الإعدادات</button><div class="card" style="margin-top:12px"><h2>النسخة الاحتياطية</h2><div class="row"><button class="b g" id="bk">تنزيل نسخة احتياطية</button><button class="b g" id="rs">مسح كل البيانات</button></div><label>استرجاع نسخة (ملف JSON)</label><input type="file" id="im" accept=".json"><div class="sub">النسخة بتشمل العمال والتسجيلات والسلف والإجازات (من غير صور السيلفي).</div></div>';
 $("gl").onclick=()=>{if(!navigator.geolocation){toast("المتصفح مبيدعمش تحديد الموقع");return}toast("جاري تحديد الموقع…");navigator.geolocation.getCurrentPosition(p=>{C.loc={lat:p.coords.latitude,lng:p.coords.longitude};C.useLoc=true;saveState();$("ls").textContent="تم تحديد موقع المحل (الدقة حوالي "+Math.round(p.coords.accuracy)+" متر)";$("s7").checked=true},()=>toast("الموقع مش متاح. اسمح للصفحة بالوصول للموقع وجرّب على التابلت"),{enableHighAccuracy:true,timeout:15000})};
 $("sv").onclick=()=>{const c=Object.assign({},C,{start:$("s1").value||"08:00",end:$("s2").value||"16:00",grace:+$("s3").value||0,off:+$("s4").value,selfie:$("s5").checked,useLoc:$("s7").checked&&!!C.loc,radius:+$("s8").value||150});if(c.end<=c.start){toast("النهاية لازم تكون بعد البداية");return}applyCfg(c);saveState();toast("تم الحفظ")};
 $("bk").onclick=async()=>{toast("جاري تجهيز النسخة…");try{const lg=(await DB.collection("log").get()).docs.map(d=>{const o=Object.assign({},d.data(),{_id:d.id});delete o.sv;delete o.svo;return o});save("attendance-backup-"+TD+".json",JSON.stringify({v:2,workers:W,cfg:C,hol:HOL,leaves:LV,adv:ADV,log:lg}))}catch(e){toast("تعذر تجهيز النسخة")}};
 $("rs").onclick=async()=>{if(!(await yn("هتمسح <b>كل العمال والتسجيلات والسلف والإجازات والعطلات</b> نهائياً. الإعدادات هتفضل. نزّل نسخة احتياطية الأول. متأكد؟")))return;toast("جاري المسح…");try{for(const c of["log","adv","leaves","requests","photos"]){const s=await DB.collection(c).get();await bw(s.docs.map(d=>b=>b.delete(d.ref)))}W.length=0;HOL.length=0;saveState();Object.keys(LB).forEach(k=>{LB[k]=[]});LOG.length=0;toast("تم المسح");aMore()}catch(e){toast("تعذر المسح")}};
 $("im").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{try{const d=JSON.parse(rd.result);if(!(d.workers&&d.log)||!(await yn("هيتم استرجاع البيانات من النسخة (بيستبدل نفس العناصر). متأكد؟")))return;toast("جاري الاسترجاع…");const ops=[];
  d.log.forEach(r=>{const id=r._id||nid(),o=Object.assign({},r);delete o._id;ops.push(b=>b.set(DB.collection("log").doc(id),o))});(d.adv||[]).forEach(a=>{const id=a.id||nid();ops.push(b=>b.set(DB.collection("adv").doc(id),Object.assign({},a,{id})))});(d.leaves||[]).forEach(l=>{const id=l.id||nid();ops.push(b=>b.set(DB.collection("leaves").doc(id),Object.assign({},l,{id})))});await bw(ops);
  W.length=0;W.push(...d.workers.map(w=>{const x=Object.assign({},w);delete x.pin;return x}));HOL.length=0;HOL.push(...(d.hol||[]));applyCfg(d.cfg);saveState();toast("تم الاسترجاع");aMore()}catch(x){toast("ملف غير صالح")}};rd.readAsText(f)}}
/* ---- الدخول ---- */
function loginView(){dockShow(false);$("xt").style.display="none";$("app").innerHTML='<div class="card kp lux"><div class="big">🔒</div><h2>دخول المدير</h2><input id="le" type="email" dir="ltr" placeholder="الإيميل" autocomplete="username"><input id="lp" type="password" dir="ltr" placeholder="الباسورد" autocomplete="current-password"><button class="b" id="lo" style="width:100%;margin-top:6px">دخول</button><button class="b g s" id="fp" style="width:100%;margin-top:10px">نسيت الباسورد؟</button></div>';
 const go=()=>AU.signInWithEmailAndPassword($("le").value.trim(),$("lp").value).catch(()=>toast("الإيميل أو الباسورد غلط"));$("lo").onclick=go;$("lp").onkeydown=e=>{if(e.key==="Enter")go()};
 $("fp").onclick=()=>{const m=$("le").value.trim();if(!m){toast("اكتب الإيميل الأول");return}AU.sendPasswordResetEmail(m).then(()=>toast("اتبعت لك رابط استعادة الباسورد على الإيميل")).catch(()=>toast("تعذر الإرسال، راجع الإيميل"))}}
let booted=false;
function boot(){if(booted)return;booted=true;$("xt").style.display="";$("app").innerHTML='<div class="card kp"><h2>جاري التحميل…</h2></div>';loadState();listen()}
$("brand").innerHTML=BRAND(40);
$("th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"};
$("xt").onclick=()=>AU.signOut().then(()=>location.reload());
setInterval(()=>{const t=dk(new Date());if(t!==TD){TD=t;CUR&&CUR()}},6e4);
if(typeof firebase==="undefined"){$("app").innerHTML='<div class="card kp"><div class="big">⚠️</div><h2>سكريبتات Firebase ما حمّلتش</h2><div class="sub" style="margin:8px 0">اتأكد من النت وجرّب تاني</div><button class="b" onclick="location.reload()">إعادة المحاولة</button></div>'}
else{firebase.initializeApp(FB);DB=firebase.firestore();AU=firebase.auth();AU.onAuthStateChanged(u=>{if(u)boot();else loginView()})}
