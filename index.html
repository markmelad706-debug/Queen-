function yn(msg){return new Promise(res=>{const m=modal('<div style="font-size:17px;line-height:1.8">'+msg+'</div><div class="row" style="margin-top:12px"><button class="b" id="y">أيوه، متأكد</button><button class="b g" id="n">لأ</button></div>');m.querySelector("#y").onclick=()=>{m.remove();res(true)};m.querySelector("#n").onclick=()=>{m.remove();res(false)}})}
const clkS=()=>{const n=new Date(),h=n.getHours();return pd(h%12||12)+":"+pd(n.getMinutes())+":"+pd(n.getSeconds())+(h<12?" ص":" م")};
const wS=r=>W.find(x=>x.id===r.w)||{};
const lateM=r=>{const w=wS(r),m=(r.in-at(r.d,w.s||SH[0]))/6e4;return !isOffW(r.d,w)&&!w.flex&&m>GR?Math.round(m):0};
const otH=r=>{const w=wS(r);return r.out&&!isOffW(r.d,w)&&!w.flex?Math.max(0,(r.out-at(r.d,w.e||SH[1]))/36e5):0};
function wHome(){let v="";clearInterval(tick);VIEW="home";CURW=null;
 $("app").innerHTML='<div class="card kp lux"><div class="ringw"><svg viewBox="0 0 120 120" class="ring"><circle cx="60" cy="60" r="54" class="rb"/><circle cx="60" cy="60" r="54" class="rf" id="rf"/></svg><div class="ringc"><div class="clock" id="clk"></div><div class="date">'+new Date().toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"})+'</div></div></div><h2>أدخل كودك</h2>'+HB()+'<div class="dots" id="dots"></div><div class="keys" id="ks">'+[1,2,3,4,5,6,7,8,9,"x",0,"ok"].map(k=>'<button class="k'+(k==="ok"?" go":k==="x"?" cl":"")+'" data-k="'+k+'">'+(k==="x"?"⌫":k==="ok"?"✓":k)+'</button>').join("")+'</div><button class="b g s" id="sr" style="margin-top:12px;width:100%">مش فاكر الكود؟ ابحث بالاسم</button></div>';
 const ring=()=>{$("clk").textContent=clkS();$("rf").style.strokeDashoffset=339.3*(1-new Date().getSeconds()/60)};ring();tick=setInterval(()=>{if($("rf"))ring()},1000);
 const dots=()=>{$("dots").innerHTML=Array.from({length:Math.max(4,v.length)},(_,i)=>'<i class="'+(i<v.length?"on":"")+'"></i>').join("")};dots();
 $("sr").onclick=wSearch;const go=()=>{const w=W.find(x=>x.code===v);if(!w){const d=$("dots");d.classList.remove("sh");void d.offsetWidth;d.classList.add("sh");navigator.vibrate&&navigator.vibrate(60);toast("الكود ده مش موجود");v="";dots();return}vt(()=>wWork(w))};
 $("ks").onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;navigator.vibrate&&navigator.vibrate(8);if(k==="x")v=v.slice(0,-1);else if(k==="ok"){go();return}else if(v.length<6)v+=k;dots();{const c=W.filter(x=>x.code.startsWith(v));if(c.length===1&&c[0].code===v)go()}}}
let TD=dk(new Date());
const offOf=w=>w&&w.off!==undefined&&w.off!==""&&w.off!==null?+w.off:OFFD,isOffW=(d,w)=>{const o=offOf(w);return o>=0&&new Date(d+"T12:00:00").getDay()===o};
function applyCfg(c){C=Object.assign({start:"08:00",end:"16:00",grace:10,off:5,selfie:false,useLoc:false,radius:150,loc:null},c||{});SH[0]=C.start;SH[1]=C.end;GR=+C.grace||0;OFFD=(C.off===""||C.off==null)?5:+C.off;RAD=+C.radius||150}
applyCfg({});
const holNow=()=>HOL.find(h=>TD>=h.from&&TD<=h.to),HB=()=>{const h=holNow();return h?'<div class="chip lv" style="margin-bottom:6px">اليوم عطلة: '+esc(h.name||"")+'</div>':""};
const open_=id=>LOG.find(r=>r.w===id&&!r.out&&Date.now()-r.in<576e5);
const stale_=id=>LOG.find(r=>r.w===id&&!r.out&&Date.now()-r.in>=576e5);
const fail=()=>toast("تعذر الحفظ، اتأكد من النت ومن ضبط ساعة الجهاز");
/* طلبات العامل (محفوظة على الجهاز بس) */
const myReq=id=>{try{return(JSON.parse(localStorage.getItem("q_req")||"{}")[id]||[])}catch(e){return[]}};
const addReq=(id,t)=>{try{const o=JSON.parse(localStorage.getItem("q_req")||"{}");o[id]=[{t,c:Date.now()}].concat(o[id]||[]).slice(0,8);localStorage.setItem("q_req",JSON.stringify(o))}catch(e){}};
/* كاميرا وموقع */
async function snap(){try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}}),v=document.createElement("video");v.srcObject=st;v.muted=true;v.playsInline=true;await v.play();await new Promise(r=>setTimeout(r,900));const c=document.createElement("canvas");c.width=c.height=100;const s=Math.min(v.videoWidth,v.videoHeight);c.getContext("2d").drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,100,100);st.getTracks().forEach(t=>t.stop());return c.toDataURL("image/jpeg",.4)}catch(e){return"x"}}
const dist=(a,b)=>{const R=6371000,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lng-a.lng)*t,x=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const getPos=()=>new Promise(res=>{if(!navigator.geolocation)return res("x");navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),()=>res("x"),{enableHighAccuracy:true,timeout:7000,maximumAge:0})});
/* التسجيل */
async function doPunch(w,act){const n=Date.now(),op=open_(w.id);
 if(act==="out"&&!op){toast("مفيش حضور مسجّل");return wHome()}if(act==="in"&&op){toast("إنت مسجّل حضور بالفعل");return wHome()}
 VIEW="busy";const useLoc=!!(C.useLoc&&C.loc);
 $("app").innerHTML='<div class="card kp"><div class="big">'+(C.selfie?"📸":"⏳")+'</div><h2>'+(C.selfie?"بصّ للكاميرا لحظة…":"جاري التسجيل…")+'</h2></div>';
 const r=await Promise.all([C.selfie?snap():null,useLoc?getPos():null]),ph=r[0],gp=r[1],g=useLoc?((!gp||gp==="x")?-1:Math.round(dist(gp,C.loc))):null,ts=firebase.firestore.FieldValue.serverTimestamp();
 try{
  if(op){op.out=n;const u={out:n,go:g,svo:ts};if(ph)u.po=ph==="x"?"x":1;DB.collection("log").doc(op._id).update(u).catch(fail);if(ph&&ph!=="x")DB.collection("photos").doc(op._id).set({o:ph},{merge:true}).catch(()=>{})}
  else{const id="r"+n+Math.random().toString(36).slice(2,6),d={w:w.id,d:dk(new Date(n)),in:n,out:null,g,p:ph?(ph==="x"?"x":1):null,sv:ts};LOG.push(Object.assign({_id:id},d));DB.collection("log").doc(id).set(d).catch(fail);if(ph&&ph!=="x")DB.collection("photos").doc(id).set({i:ph}).catch(()=>{})}
 }catch(e){fail()}
 $("app").innerHTML='<div class="card kp"><div class="ok-ic">✓</div><h2>تم تسجيل '+(act==="in"?"حضورك":"انصرافك")+'</h2><div class="clock">'+t12(n)+'</div><div class="date">'+esc(w.name)+'</div>'+(navigator.onLine?"":'<div class="sub">مفيش نت — هيتسجّل أول ما النت يرجع</div>')+'</div>';setTimeout(wHome,3000)}
async function pu(w,op){if(op&&!isOffW(TD,w)&&!w.flex&&Date.now()<at(TD,w.e||SH[1])-GR*6e4&&!(await yn("الوقت قبل نهاية الشغل. هيتسجّل <b>انصراف مبكر</b>. تكمل؟")))return;doPunch(w,op?"out":"in")}
function stats(w){const by={};LOG.filter(r=>r.w===w.id).forEach(r=>{(by[r.d]=by[r.d]||[]).push(r)});let late=0,om=0,p=0;Object.keys(by).forEach(d=>{const a=by[d].sort((x,y)=>x.in-y.in),mm={w:w.id,d,in:a[0].in,out:a[a.length-1].out};p++;if(lateM(mm))late++;om+=Math.round(otH(mm)*60)});return{p,late,o:om/60}}
function reqM(w,k){const F='<div class="row" style="margin-top:8px"><button class="b" id="ok">إرسال</button><button class="b g" id="no">إلغاء</button></div>',m=modal((k?'<h2>طلب سلفة</h2><label>المبلغ بالجنيه</label><input id="a1" type="number" min="1" inputmode="decimal"><label>ملاحظة (اختياري)</label><input id="a4">':'<h2>طلب إجازة</h2><div class="row"><div><label>من</label><input type="date" id="a2" value="'+TD+'"></div><div><label>إلى</label><input type="date" id="a3" value="'+TD+'"></div></div>')+F),q=s=>m.querySelector(s);
 q("#no").onclick=()=>m.remove();
 q("#ok").onclick=()=>{const id="rq"+Date.now()+Math.random().toString(36).slice(2,6),base={workerId:w.id,workerName:w.name,workerCode:w.code,created:Date.now(),status:"وصل للمدير"};let doc,t;
  if(k){const a=+q("#a1").value;if(!(a>0)){toast("اكتب مبلغاً صحيحاً");return}doc=Object.assign({kind:"advance",amount:a,note:q("#a4").value.trim()},base);t="سلفة "+a.toLocaleString("ar-EG")+" ج"}
  else{const f=q("#a2").value,e=q("#a3").value;if(!f||!e||e<f){toast("راجع التواريخ");return}doc=Object.assign({kind:"leave",from:f,to:e},base);t="إجازة من "+f+" إلى "+e}
  DB.collection("requests").doc(id).set(doc).catch(()=>toast("تعذر إرسال الطلب، جرّب تاني"));addReq(w.id,t);m.remove();wWork(w);toast("تم إرسال الطلب للمدير")}}
function wWork(w){clearInterval(tick);VIEW="work";CURW=w;
 const op=open_(w.id),st=stale_(w.id),s=stats(w),my=myReq(w.id),hr=new Date().getHours(),g=hr<12?"صباح الخير":hr<18?"مساء الخير":"مساء النور",rc=LOG.filter(r=>r.w===w.id).sort((a,b)=>b.in-a.in).slice(0,5);
 $("app").innerHTML='<div class="bento"><div class="card s12 prof"><div class="av lg">'+esc(w.name[0])+'</div><div style="flex:1"><div class="sub">'+g+'</div><h2 style="margin:0;font-size:24px">'+esc(w.name)+'</h2><div class="sub">كود '+esc(w.code)+'</div></div><span class="chip'+(op?"":" off")+'">'+(op?"● حاضر الآن":"لم يسجل بعد")+'</span></div>'+
 (st?'<div class="card s12" style="border-color:var(--bad)"><b>⚠️ يوم '+st.d+' ما اتسجّلش له انصراف.</b> <span class="sub">كلّم المدير عشان يتعدّل.</span></div>':"")+
 '<div class="card s6 pc"><button class="pb'+(op?" out":"")+'" id="pb"><span>'+(op?"🔴":"🟢")+'</span><b>'+(op?"انصراف":"حضور")+'</b></button><div class="sub" id="el">'+(op?"":"اضغط لتسجيل الحضور")+'</div><div class="row" style="margin-top:12px"><button class="b g" id="ra">💵 سلفة</button><button class="b g" id="rl">🏖️ إجازة</button></div></div>'+
 '<div class="s6 col"><div class="kpi"><b data-n="'+s.p+'">0</b><span>أيام حضور (آخر 10 أيام)</span></div><div class="kpi"><b data-n="'+s.late+'">0</b><span>مرات التأخير</span></div><div class="kpi"><b>'+fh(s.o)+'</b><span>ساعات إضافية</span></div></div>'+
 '<div class="card s6"><h2>طلباتي</h2>'+(my.length?my.map(r=>'<div class="item"><span>'+esc(r.t)+'</span><span class="chip lv">وصل للمدير</span></div>').join(""):'<div class="sub">لا توجد طلبات</div>')+'</div>'+
 '<div class="card s6"><h2>آخر التسجيلات</h2>'+(rc.map(x=>'<div class="item"><span>'+x.d+'</span><span class="sub">'+t12(x.in)+(x.out?" → "+t12(x.out):" → …")+'</span></div>').join("")||'<div class="sub">لا توجد تسجيلات</div>')+'</div></div><button class="b g" id="bk" style="width:100%;margin-top:12px">تسجيل خروج</button>';
 $("bk").onclick=()=>vt(wHome);$("pb").onclick=()=>pu(w,op);$("ra").onclick=()=>reqM(w,1);$("rl").onclick=()=>reqM(w,0);cnt();
 if(op){const u=()=>{const e=$("el");if(e)e.textContent="مدة التواجد: "+fh((Date.now()-op.in)/36e5)};u();tick=setInterval(u,1000)}}
function wSearch(){VIEW="home";clearInterval(tick);
 $("app").innerHTML='<div class="card"><div class="row"><h2 style="margin:0">ابحث بالاسم</h2><button class="b g s" id="bk" style="flex:0 0 auto">← رجوع</button></div><input id="q" placeholder="اكتب جزء من الاسم" style="margin-top:10px"><div id="rs"></div></div>';
 $("bk").onclick=wHome;const q=$("q"),rs=$("rs");q.focus();q.oninput=()=>{const t=q.value.trim();if(t.length<2){rs.innerHTML="";return}const l=W.filter(w=>w.name.includes(t)).slice(0,25);rs.innerHTML=l.map(w=>'<button class="item" data-id="'+w.id+'" style="width:100%;text-align:right"><span>'+esc(w.name)+'</span><span class="sub">'+esc(w.code)+'</span></button>').join("")||'<div class="sub" style="text-align:center;padding:10px">مفيش نتائج</div>'};
 rs.onclick=e=>{const b=e.target.closest("[data-id]");if(b)wWork(W.find(x=>x.id===b.dataset.id))}}
/* ---- تحميل البيانات ---- */
let first=true;
function err(){$("app").innerHTML='<div class="card kp"><div class="big">⚠️</div><h2>مفيش اتصال بالبيانات</h2><div class="sub" style="margin:8px 0">اتأكد من النت وجرّب تاني</div><button class="b" onclick="location.reload()">إعادة المحاولة</button></div>'}
function apply(o){W.length=0;W.push(...(o.workers||[]).filter(w=>!w.arch));HOL.length=0;HOL.push(...(o.hol||[]));applyCfg(o.cfg);if(first){first=false;wHome()}}
function startData(){
 DB.doc("app/public").onSnapshot(sn=>{if(sn.exists){try{apply(JSON.parse(sn.data().json))}catch(e){err()}}else DB.doc("app/state").get().then(s=>{if(s.exists){try{apply(JSON.parse(s.data().json))}catch(e){err()}}else apply({})}).catch(err)},err);
 const since=dk(new Date(Date.now()-10*864e5));
 DB.collection("log").where("d",">=",since).onSnapshot(q=>{LOG.length=0;q.docs.forEach(d=>LOG.push(Object.assign(d.data(),{_id:d.id})));if(VIEW==="work"&&CURW&&!document.querySelector(".mo"))wWork(CURW)},()=>{})}
/* ---- بدء التشغيل ---- */
if(typeof firebase==="undefined")err();
else{firebase.initializeApp(FB);DB=firebase.firestore();try{DB.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}$("app").innerHTML='<div class="card kp"><h2>جاري التحميل…</h2></div>';startData()}
$("brand").innerHTML=BRAND(40);
let WL=null;const wl=async()=>{try{WL=await navigator.wakeLock.request("screen")}catch(e){}};wl();document.addEventListener("visibilitychange",()=>{if(!document.hidden)wl()});
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,()=>{idle=Date.now()},{passive:true}));
setInterval(()=>{const t=dk(new Date());if(t!==TD)TD=t;if(VIEW==="work"&&Date.now()-idle>45e3&&!document.querySelector(".mo"))wHome()},5e3);
